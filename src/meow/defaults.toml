# Meow OS defaults.
# Override any value in your own config file (`meow config` prints its path).
# Tables merge key by key; arrays such as [[schedule]] and [[courses]] replace the default list.

[user]
name = "Aniket"
timezone = "Asia/Kolkata"
github = "ThatAnacondaGuy"
career_goal = "NVIDIA: GPU, CUDA, AI/ML engineering"

# ── Weekly rhythm ────────────────────────────────────────────────────────
# kind = sleep    quiet hours: never scheduled, no notifications
#        routine  busy, never scheduled
#        college  busy, never scheduled
#        focus    the only time the planner may place work
# A block whose end is at or before its start runs past midnight.

[[schedule]]
name = "Sleep"
kind = "sleep"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
start = "04:00"
end = "08:00"

[[schedule]]
name = "Morning routine"
kind = "routine"
days = ["mon", "tue", "wed", "thu", "fri"]
start = "08:00"
end = "09:15"

[[schedule]]
name = "College"
kind = "college"
days = ["mon", "tue", "wed", "thu", "fri"]
start = "09:15"
end = "16:30"

[[schedule]]
name = "Deep focus"
kind = "focus"
days = ["mon", "tue", "wed", "thu", "fri"]
start = "16:30"
end = "04:00"

[[schedule]]
name = "Weekend"
kind = "focus"
days = ["sat", "sun"]
start = "08:00"
end = "04:00"

