[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agents*", "integrations*", "models*", "memory*", "database*", "api*", "scheduler*", "security*"]

[project]
name = "meow-os"
version = "0.1.0"
description = "Local-first AI Chief of Staff"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "aiosqlite",
    "chromadb",
    "apscheduler>=3.10",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "pygithub",
    "feedparser",
    "beautifulsoup4",
    "selectolax",
    "keyring",
    "rich",
    "typer",
    "python-multipart",
    "websockets",
    "jinja2",
    "toml",
    "python-dateutil",
    "pytz"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
