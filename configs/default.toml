[system]
name = "Meow OS"
version = "0.1.0"
data_dir = "~/.meow_os"
log_level = "INFO"

[user]
name = "Aniket"
github_username = "ThatAnacondaGuy"
timezone = "Asia/Kolkata"

[models]
default_model = "llama3"
extraction_model = "llama3"
planning_model = "llama3"
embedding_model = "nomic-embed-text"
ollama_base_url = "http://localhost:11434"

[server]
host = "127.0.0.1"
port = 8000

[security]
authority_levels = ["AUTOMATIC", "CONFIRM", "EXPLICIT"]
credential_backend = "keychain"
